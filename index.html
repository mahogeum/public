<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>피첵 족보 퀴즈</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#191c21; --ink2:#4b5563; --muted:#6b7280;
    --line:#e3e6ea; --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 30px rgba(16,24,40,.07);
    --circ:#2f6feb; --resp:#0f9d6f;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1216; --card:#181c22; --ink:#e9ecf0; --ink2:#c6ccd5; --muted:#8f99a6;
          --line:#2a3037; --shadow:none; --circ:#6f9dff; --resp:#48d19b}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--ink);
    padding:calc(34px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:520px}
  h1{font-size:22px; margin:0 0 6px; letter-spacing:-.02em}
  .lead{font-size:14px; color:var(--muted); margin:0 0 26px; line-height:1.55}
  a.item{
    display:flex; align-items:center; gap:15px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:19px 18px; margin-bottom:14px; box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  a.item:active{transform:scale(.985)}
  .dot{width:46px;height:46px;border-radius:14px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;font-weight:700}
  .circ .dot{background:var(--circ)} .resp .dot{background:var(--resp)}
  .txt{flex:1; min-width:0}
  .name{font-size:16.5px; font-weight:700; letter-spacing:-.01em; margin-bottom:4px}
  .meta{font-size:12.5px; color:var(--muted)}
  .arrow{color:var(--muted); font-size:18px}
  .note{margin-top:22px; font-size:12px; color:var(--muted); line-height:1.6; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>피첵 족보 퀴즈</h1>
  <p class="lead">단원별로 넘기며 풀 수 있는 퀴즈예요.<br>호흡기는 링크를 열면 바로 시작됩니다.</p>

  <a class="item circ" href="circ.html">
    <span class="dot">순</span>
    <span class="txt">
      <span class="name">순환기 피첵 족보 퀴즈</span>
      <span class="meta">35개 단원 · 1,168문항</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <a class="item resp" href="resp.html">
    <span class="dot">호</span>
    <span class="txt">
      <span class="name">호흡기 피첵 족보 퀴즈</span>
      <span class="meta">42개 단원 · 1,024문항</span>
    </span>
    <span class="arrow">›</span>
  </a>

  <p class="note">개인 학습용 자료입니다. 링크를 공유하지 마세요.<br>홈 화면에 추가하면 앱처럼 열 수 있어요.</p>
</div>
</body>
</html>
